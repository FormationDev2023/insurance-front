@if (isOpen) {
  <div class="dialog-backdrop">
    <div class="dialog-container">
      <div class="dialog-header" [class]="'dialog-' + type">
        <h3>{{ title }}</h3>
      </div>
      <div class="dialog-body">
        <p>{{ message }}</p>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" (click)="cancel()" type="button">
          {{ cancelText }}
        </button>
        <button class="btn" [class]="'btn-' + type" (click)="confirm()" type="button">
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
